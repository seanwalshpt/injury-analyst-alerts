name: Injury monitor

on:
  # How runs start:
  # - While games are on or coming up (within 8h), each run starts the next one
  #   itself when it finishes ("Queue the next check" below), so coverage is
  #   continuous on game days.
  # - GitHub's schedule (unreliable, often only every few hours) restarts that
  #   chain if it ever stops, and covers no-game hours.
  # - Optional: an external scheduler such as cron-job.org can also call the
  #   "run workflow" API with from_scheduler=true (see README).
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Only send a test Telegram message"
        type: boolean
        default: false
      from_scheduler:
        description: "Set by automatic triggers (leave unchecked for manual runs)"
        type: boolean
        default: false

# Never run two checks at once (they share the same "already seen" memory).
concurrency:
  group: injury-monitor
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # only used to start the next check (GitHub's own token, this repo only)

jobs:
  check:
    # Automatic runs (GitHub schedule or the external scheduler) only happen
    # while the repository variable MONITOR_ENABLED = true. Manual runs from the
    # Actions tab always work. Skipped runs cost nothing.
    if: vars.MONITOR_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.from_scheduler)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore memory of already-seen stories
        if: ${{ !inputs.test_message }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: injury-state-${{ github.run_id }}
          restore-keys: injury-state-

      - name: Check for new injuries
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py ${{ inputs.test_message && '--test' || '' }}

      - name: Save memory of seen stories
        # always(): keep the memory even if the check step errored, so alerts that
        # were already sent aren't sent again next run.
        if: ${{ always() && !inputs.test_message && hashFiles('state/state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: injury-state-${{ github.run_id }}

      - name: Queue the next check
        # Runs even if the check step hit an error, so one bad network moment
        # on a Sunday doesn't stop coverage. MONITOR_ENABLED=false still stops it.
        if: ${{ always() && !inputs.test_message && steps.check.outputs.chain == 'true' && vars.MONITOR_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml -R "${{ github.repository }}" --ref main -f from_scheduler=true
